<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dynamic Pricing Engine</title>
<style>
body{font:15px system-ui,sans-serif;margin:0;background:#f4f5f7;color:#1a1a1a}
header{background:#1f2a44;color:#fff;padding:14px 24px;font-size:18px}
main{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px;max-width:1100px;margin:auto}
@media(max-width:800px){main{grid-template-columns:1fr}}
section{background:#fff;border-radius:8px;padding:16px;box-shadow:0 1px 3px #0002}
h2{margin:0 0 12px;font-size:16px}
table{width:100%;border-collapse:collapse}td,th{padding:6px;text-align:left;border-bottom:1px solid #eee}
input,select{padding:6px;width:100%;box-sizing:border-box;margin-bottom:10px}
input[type=number]{width:70px;margin:0}
button{background:#2f6fed;color:#fff;border:0;padding:10px 16px;border-radius:6px;cursor:pointer;margin-right:6px}
button.alt{background:#555}
pre{background:#111;color:#e6e6e6;padding:12px;border-radius:6px;overflow:auto;white-space:pre-wrap;min-height:120px}
.exp{color:#c0392b;font-size:12px}
</style></head><body>
<header>Dynamic Pricing &amp; Discount Rule Engine</header>
<main>
<section><h2>1. Products</h2><table id="cat"></table></section>
<section>
 <h2>2. Customer &amp; offers</h2>
 <label>Customer</label><select id="cust"></select>
 <label>Coupon code (optional)</label><input id="coupon" placeholder="e.g. WELCOME10">
 <label>Paying with</label>
 <select id="bank"><option value="">Cash / other</option><option>HDFC</option><option>SBI</option>
  <option>ICICI</option><option>Apna Bank</option><option>Duroka Bank</option></select>
 <button onclick="go('5')">Checkout</button>
 <button class="alt" onclick="go('6')">Price trace</button>
 <button class="alt" onclick="go('10')">Best offer combo</button>
</section>
<section style="grid-column:1/-1"><h2>3. Result (from the C++ engine)</h2><pre id="out">Add items and press Checkout.</pre></section>
</main>
<script>
const $=id=>document.getElementById(id);
fetch('/api/data').then(r=>r.json()).then(d=>{
 $('cat').innerHTML='<tr><th>Item</th><th>Category</th><th>Price</th><th>Qty</th></tr>'+d.products.map(p=>
  `<tr><td>${p.name}<br><small>${p.id}</small></td><td>${p.type}</td><td>₹${p.price}</td>
   <td><input type="number" min="0" value="0" data-id="${p.id}"></td></tr>`).join('');
 $('cust').innerHTML=d.customers.map(c=>`<option value="${c.id}">${c.name} (${c.tier})</option>`).join('');
});
async function go(action){
 const cart={};document.querySelectorAll('[data-id]').forEach(i=>cart[i.dataset.id]=+i.value);
 $('out').textContent='Working...';
 const r=await fetch('/api',{method:'POST',body:JSON.stringify({cart,customer:$('cust').value,
  coupon:$('coupon').value,bank:$('bank').value,action})});
 $('out').textContent=(await r.json()).output;
}
</script></body></html>
